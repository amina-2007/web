</head>

<body>
    <div class="head">
        <header align="center" >
            <p  align="center">ПУТЕШЕСТВИЕ В КОСМИЧЕСКОЕ ПРОСТРАНСТВО</p>
            <nav class="menu">

                <a href="create.html">ДОБАВИТЬ ПЛАНЕТУ?! </a> 
                <a href="about.html">ЧТО ЭТО ВООБЩЕ ТАКОЕ! </a>

            </nav>
        </header>
    </div>
<div class="invisible"></div>
    <div class="space" id="space">
        <div class="sun" onclick="window.location.href='info.html?id=sun'"> </div>
        <div class="planet mercury" onclick="window.location.href='info.html?id=mercury'"></div>
        <div class="planet venus" onclick="window.location.href='info.html?id=venus'"></div>
        <div class="planet earth" onclick="window.location.href='info.html?id=earth'"></div>
        <div class="planet mars" onclick="window.location.href='info.html?id=mars'"></div>
        <div class="planet jupiter" onclick="window.location.href='info.html?id=jupiter'"></div>
        <div class="planet saturn" onclick="window.location.href='info.html?id=saturn'"></div>
        <div class="planet uranus" onclick="window.location.href='info.html?id=uranus'"></div>
        <div class="planet neptune" onclick="window.location.href='info.html?id=neptune'"></div>
        <div class="black hole" onclick="window.location.href='info.html?id=black'"></div>
        <div class="andromeda" onclick="window.location.href='info.html?id=andromeda'"></div>
        <div class="volopas" onclick="window.location.href='info.html?id=volopas'"></div>
        <div class="vkusno" onclick="window.location.href='info.html?id=vkusno'"></div>
        <div class="voyager" onclick="window.location.href='info.html?id=voyager'"></div>

        <div id="customLayer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
    </div>
<script>
window.addEventListener('DOMContentLoaded', function() {
    var customPlanets = JSON.parse(localStorage.getItem('customPlanets')) || [];
    var customLayer = document.getElementById('customLayer');
    if (!customLayer) return;

   for (let i = 0; i < customPlanets.length; i++) {
    let p = customPlanets[i];

    var el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.left = p.posX + 'px';
        el.style.top = p.posY + 'px'; 
el.style.width = (p.size || 80) + 'px';
el.style.height = (p.size || 80) + 'px';
        el.style.borderRadius = '50%';
      el.style.backgroundImage = 'url(' + p.icon + ')';
        el.style.backgroundSize = 'cover';
        el.style.cursor = 'help'; 
        el.style.transform = 'translate(-50%, -50%)';
        el.style.pointerEvents = 'auto';

        if (p.animation === 'spin') {
            el.style.animation = 'customSpin 4s linear infinite';
        } else if (p.animation === 'pulse') {
            el.style.animation = 'customPulse 1.5s ease-in-out infinite';
        } else if (p.animation === 'shake') {
            el.style.animation = 'shake 0.5s linear infinite';
        } else if (p.animation === 'float') {
            el.style.animation = 'customFloat 3s ease-in-out infinite';
        } else if (p.animation === 'glow') {
            el.style.animation = 'customGlow 2s ease-in-out infinite';
        }

        el.title = p.title;
        (function(planet) {
        el.onclick = function() {
            window.location.href = 'info.html?id=' + planet.id;
        };
    })(p);

    customLayer.appendChild(el);
}
});
</script>
</body>

</html>
