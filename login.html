<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stil/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <title>Оформить поездку</title>
</head>

<body bgcolor="black">
    <section id="cost" align="center">
        <p align="center">ОФОРМИТЬ ПОЕЗДКУ</p>
        <form id="orderForm">
    <label for="nik">НИК</label><br>
    <input type="text" id="nik" name="nik" placeholder="Любой" required><br><br>
    
    <label for="email">ПОЧТА</label><br>
    <input type="email" id="email" name="email" placeholder="example@mail.ru" required><br><br>
    
    <label for="planet">КОСМИЧЕСКИЙ ОБЪЕКТ</label><br>
    <select id="planet" name="planet">
        <option value="mercury">Меркурий</option>
        <option value="venus">Венера</option>
        <option value="earth">Земля</option>
        <option value="mars">Марс</option>
        <option value="jupiter">Юпитер</option>
        <option value="saturn">Сатурн</option>
        <option value="uranus">Уран</option>
        <option value="neptune">Нептун</option>
        <option value="andromeda">Андромеда</option>
        <option value="ton618">ТОН618</option>
        <option value="volopas">Пустота волопаса</option> 
    </select><br><br>
    
    <label for="rocket">ТРАНСПОРТ</label><br>
    <select id="rocket" name="rocket">
        <option value="def">Ракета обыкновенная</option>
        <option value="bab">Ракета неотечественная</option>
        <option value="nlo">Ракета в стиле НЛО</option>
        <option value="what">Астрал при помощи удара тупым предметом</option>
    </select><br><br>
    
    <button type="submit" id="ord">ЗАКАЗАТЬ</button>
</form>
    <button class="oklist" onclick="window.location.href='index.html'" >В МЕНЮ</button>

    </section>
    
</body>
<script>
document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var nik = document.getElementById('nik').value;
    var planet = document.getElementById('planet').value;
    
    if (nik.trim() === '') {
        alert('Заполните НИК!');
        return;
    }
     
    localStorage.setItem('orderPlaced', 'true');
    localStorage.setItem('orderName', nik);
     
    var planetNames = {
        'mercury': 'МЕРКУРИЙ',
        'venus': 'ВЕНЕРА',
        'earth': 'ЗЕМЛЯ',
        'mars': 'MAPC',
        'jupiter': 'ЮПИТЕР',
        'saturn': 'CATУРН',
        'uranus': 'УРАН',
        'neptune': 'НЕПТУН',
        'andromeda': 'АНДРОМЕДА',
        'ton618': 'TON618',
        'volopas': 'ПУСТОТА ВОЛОПАСА'
    };
    
    var planetName = planetNames[planet] || planet;
    
    var visited = JSON.parse(localStorage.getItem('visitedPlanets')) || [];
    if (!visited.includes(planetName)) {
        visited.push(planetName);
        localStorage.setItem('visitedPlanets', JSON.stringify(visited));
    }
    
    alert('Заявка принята, ' + nik + '! Вы летите на ' + planetName + '. Конечно же, данные сохранены.'); 
});
</script>
</html>
